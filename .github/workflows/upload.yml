name: Approve YouTube upload
on:
  workflow_dispatch:
    inputs:
      preview_tag:
        description: 'Tag of the unpublished preview draft'
        required: true
        type: string
      episode_id:
        description: 'Episode id from the review draft'
        required: true
        type: string
      bundle_sha256:
        description: 'Exact SHA256 of the ZIP you reviewed'
        required: true
        type: string
      visibility:
        description: 'Visibility explicitly authorized by you'
        required: true
        default: private
        type: choice
        options: [private, unlisted, public]
      confirmation:
        description: 'APPROVE <episode_id> <bundle_sha256> <visibility>'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: sticktwist-youtube-upload
  cancel-in-progress: false
jobs:
  upload:
    if: >-
      vars.YOUTUBE_UPLOAD_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install google-api-python-client==2.179.0 google-auth-oauthlib==1.2.2
      - name: Verify owner approval, exact bundle and intended channel, then upload once
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python -m sticktwist.upload
