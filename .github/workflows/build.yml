name: Build review videos
on:
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week starting Monday, YYYY-MM-DD; blank = coming Monday'
        required: false
        type: string
      count:
        description: '1 = first test video; 5 = complete weekly queue'
        required: true
        default: '5'
        type: choice
        options: ['1', '5']
permissions:
  contents: write
concurrency:
  group: sticktwist-build
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.LEGACY_RENDER_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_WEEK: ${{ inputs.week }}
      REQUESTED_COUNT: ${{ inputs.count || '5' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate code and story bank
        run: python -m unittest discover -s tests -v
      - name: Prepare five-story queue and persist without media
        shell: bash
        run: |
          set -euo pipefail
          WEEK="${REQUESTED_WEEK:-$(date -u -d 'next monday' +%F)}"
          python -m sticktwist.generate --week "$WEEK"
          git config user.name 'sticktwist-bot'
          git config user.email 'sticktwist-bot@users.noreply.github.com'
          git add queue/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare five-story queue for $WEEK"
            git push origin HEAD:main
          fi
      - name: Install free cloud media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Download public-domain-dataset voice
        run: |
          mkdir -p models
          python -m piper.download_voices en_US-ljspeech-medium --data-dir models
      - name: Render and verify MP4 in this cloud runner
        run: python -m sticktwist.render --limit "$REQUESTED_COUNT"
      - name: Save unpublished review draft without Actions artifact storage
        run: python -m sticktwist.store_preview

